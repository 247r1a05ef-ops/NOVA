<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA - AI Learning Companion</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div style="
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 30px;
    ">


        <div>

            <h1 style="
                font-size: 60px;
                margin-bottom: 15px;
            ">
                🚀 NOVA
            </h1>


            <h2>
                AI Learning Companion
            </h2>


            <p style="
                margin: 20px 0;
                color: #64748b;
                font-size: 18px;
            ">
                Learn. Practice. Grow with AI.
            </p>


            <button
                class="login-btn"
                onclick="goToLogin()"
                style="
                    padding: 15px 30px;
                    border: none;
                    border-radius: 12px;
                    background: #6366f1;
                    color: white;
                    font-size: 16px;
                    font-weight: bold;
                    cursor: pointer;
                "
            >
                🚀 Get Started
            </button>


        </div>


    </div>



    <script>

        function goToLogin() {

           window.location.href = "frontend/pages/login.html";

        }

    </script>

</html>
